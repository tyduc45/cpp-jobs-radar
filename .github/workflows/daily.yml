name: Daily C++ jobs

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Australia/Sydney
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'sources.json'
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/**'

concurrency:
  group: cpp-jobs-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data and email integrity
        run: python -m unittest discover -s tests -v
      - name: Crawl public job feeds
        id: crawl
        continue-on-error: true
        run: python -u radar.py crawl
      - name: Persist discovery queue before sending
        id: persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update C++ jobs and notification queue [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Email new jobs
        id: email
        continue-on-error: true
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python radar.py notify
      - name: Persist accepted email receipt
        if: always() && steps.persist.outcome == 'success'
        run: |
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: save email delivery receipt [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build website
        if: always() && steps.persist.outcome == 'success'
        run: python radar.py build
      - name: Upload Pages artifact
        id: artifact
        if: always() && steps.persist.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Website artifact ready
        id: ready
        if: always() && steps.artifact.outcome == 'success'
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Report crawl or notification failures
        if: always() && (steps.crawl.outcome == 'failure' || steps.email.outcome == 'failure')
        run: |
          echo '::error::Crawl or email failed. Check the steps above. The website is deployed independently; unsent jobs remain queued.'
          exit 1

  deploy:
    if: always() && needs.collect.outputs.ready == 'true'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
